name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mask
        uses: taiki-e/install-action@v2
        with:
          tool: mask

      - name: Lint
        run: mask lint

      - name: Schema is fresh
        run: mask schema check

      - name: Test
        run: mask test
