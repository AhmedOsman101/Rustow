name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (default: latest release)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
              echo "no tag input given; using latest release: $TAG"
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "unsupported event: ${{ github.event_name }}"
          exit 1

  build-linux:
    name: Build Linux Binaries
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mask
        uses: taiki-e/install-action@v2
        with:
          tool: mask,cross

      - name: Build binaries
        run: mask release

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux
          path: bin/
          retention-days: 7

  build-macos:
    name: Build macOS Binaries
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build binaries
        run: |
          mkdir -p bin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/rustow bin/rustow-macos-x64
          cp target/aarch64-apple-darwin/release/rustow bin/rustow-macos-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-macos
          path: bin/
          retention-days: 7

  build-windows:
    name: Build Windows Binaries
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Build binaries
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc
          copy target/x86_64-pc-windows-msvc/release/rustow.exe bin/rustow-windows-x64.exe
          copy target/aarch64-pc-windows-msvc/release/rustow.exe bin/rustow-windows-arm64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-windows
          path: bin/
          retention-days: 7

  upload:
    name: Attach Binaries to Release
    needs: [resolve, build-linux, build-macos, build-windows]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: binaries

      - name: Merge bins
        run: |
          mkdir -p release
          cp binaries/binaries-linux/* binaries/binaries-macos/* binaries/binaries-windows/* release/

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          overwrite_files: true
          files: |
            release/rustow-linux-gnu-x64
            release/rustow-linux-gnu-arm64
            release/rustow-linux-musl-x64
            release/rustow-linux-musl-arm64
            release/rustow-macos-x64
            release/rustow-macos-arm64
            release/rustow-windows-x64.exe
            release/rustow-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
