name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mask
        uses: taiki-e/install-action@v2
        with:
          tool: mask,cross

      - name: Build binaries
        run: mask release

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-linux
          path: bin/
          retention-days: 7

  build-macos:
    name: Build macOS Binaries
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build binaries
        run: |
          mkdir -p bin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/rustow bin/rustow-macos-x64
          cp target/aarch64-apple-darwin/release/rustow bin/rustow-macos-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-macos
          path: bin/
          retention-days: 7

  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Build binaries
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc
          copy target/x86_64-pc-windows-msvc/release/rustow.exe bin/rustow-windows-x64.exe
          copy target/aarch64-pc-windows-msvc/release/rustow.exe bin/rustow-windows-arm64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-windows
          path: bin/
          retention-days: 7

  upload:
    name: Attach Binaries to Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: binaries

      - name: Merge bins
        run: |
          mkdir -p release
          cp binaries/binaries-linux/* binaries/binaries-macos/* binaries/binaries-windows/* release/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/rustow-linux-gnu-x64
            release/rustow-linux-gnu-arm64
            release/rustow-linux-musl-x64
            release/rustow-linux-musl-arm64
            release/rustow-macos-x64
            release/rustow-macos-arm64
            release/rustow-windows-x64.exe
            release/rustow-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
