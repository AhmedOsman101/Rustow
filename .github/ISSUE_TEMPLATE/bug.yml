name: "🐛 Bug Report"
description: Report something that isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide enough detail to help us fix it.
  - type: input
    id: title
    attributes:
      label: Bug summary
      placeholder: e.g. "rustow panics when linking an empty package"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the commands and any relevant directory layout.
      placeholder: |
        1. Run `rustow link <pkg>`
        2. See error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. "It should skip the empty package instead of crashing."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and environment
      description: Paste any error logs and mention your OS and rustow version (`rustow --version`).
      placeholder: |
        Arch Linux, rustow 0.1.0
        Error:
        ```
        ...
        ```
    validations:
      required: false
