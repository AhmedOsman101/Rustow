name: "🧑‍💻 Good First Issue"
description: A small, beginner-friendly issue for first-time contributors.
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is great for first-time contributors! Please read the [spec](../blob/main/docs/spec.md) first — it documents the intended behavior.
  - type: input
    id: title
    attributes:
      label: Task summary
      placeholder: e.g. "Improve error message for an unresolvable source directory"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: |
        The error message shown when ... is vague.
        Improve it by ...
    validations:
      required: true
  - type: textarea
    id: hint
    attributes:
      label: Hints / Getting Started
      placeholder: |
        - Look at `src/link.rs`
        - See how existing error messages are written
        - Run `cargo test --test link_plan` to test
    validations:
      required: false
