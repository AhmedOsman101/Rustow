name: "✨ Feature Request"
description: Suggest a new idea or enhancement for rustow.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to improve rustow? We'd love to hear it!
  - type: input
    id: title
    attributes:
      label: Feature title
      placeholder: e.g. "Add a --dry-run flag to unlink"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Describe what you want to happen.
      placeholder: |
        I'd like to have ... so that ...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      placeholder: Helps make the tool safer / more convenient ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: |
        1. Use `--dry-run` with a wrapper script
        2. Use ...
    validations:
      required: false
