[package]
name = "rustow"
version = "0.1.0"
edition = "2024"
description = "A Stow-compatible dotfiles linker written in Rust, with modern UX"
license = "GPL-2.0-or-later"
repository = "https://github.com/AhmedOsman101/Rustow"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
serde_json = "1.0"
schemars = { version = "1", features = ["derive"] }
shellexpand = "3"
shlex = "2"
globset = "0.4"
regex = "1"
walkdir = "2"
tabled = { version = "0.22", default-features = false, features = ["ansi"] }
owo-colors = { version = "4", features = ["supports-color"] }
dialoguer = "0.11"
thiserror = "2"
dirs = "7"
husky-rs = "0.4.0"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
