[package]
name = "rustow"
version = "0.1.0"
edition = "2024"
description = "A Stow-compatible dotfiles linker written in Rust, with Tuckr-style status UX"
license = "MIT"
repository = ""

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"
schemars = { version = "1", features = ["derive"] }
shellexpand = "3"
globset = "0.4"
regex = "1"
walkdir = "2"
tabled = "0.17"
owo-colors = { version = "4", features = ["supports-color"] }
dialoguer = "0.11"
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
